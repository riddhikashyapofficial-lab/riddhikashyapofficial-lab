name: Build ShopMaster APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'shopmaster-pos-store-BUILD-READY.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          mkdir project
          unzip -q shopmaster-pos-store-BUILD-READY.zip -d project

      - name: Build APK
        working-directory: project
        run: |
          ROOT=$(dirname "$(find . -name settings.gradle.kts -o -name settings.gradle | head -1)")
          cd "$ROOT"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopMaster-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
